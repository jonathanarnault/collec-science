services:
  app:
    build:
      context: docker/app
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/collec2App/collec-science
    depends_on:
      db:
        condition: service_healthy
      maildev:
        condition: service_started

  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./install:/install:ro
      - ./docker/db/init.sh:/docker-entrypoint-initdb.d/20-collec.sh:ro
    healthcheck:
      # TCP check: the init-time server only listens on the unix socket
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "collec", "-d", "collec"]
      interval: 5s
      timeout: 5s
      retries: 20

  maildev:
    image: maildev/maildev
    ports:
      - "1080:1080"

volumes:
  db-data:
